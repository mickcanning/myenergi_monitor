<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}myenergi monitor{% endblock %}</title>
  <script>
    // Apply the theme before first paint so dark doesn't flash white. Until the user picks one,
    // start from the OS setting.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      if (saved !== "light" && saved !== "dark") saved = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = saved;
    })();
  </script>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/app-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <strong>myenergi monitor</strong>
    <nav>
      {% if request.endpoint != 'login' %}
      <a href="{{ url_for('overview') }}" {% if request.endpoint == 'overview' %}class="on"{% endif %}>Overview</a>
      <a href="{{ url_for('energy_page') }}" {% if request.endpoint == 'energy_page' %}class="on"{% endif %}>Energy</a>
      <a href="{{ url_for('car_page') }}" {% if request.endpoint == 'car_page' %}class="on"{% endif %}>Car</a>
      <a href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}class="on"{% endif %}>Live values</a>
      <a href="{{ report_link }}" {% if request.endpoint in ('upload', 'report', 'stored_report') %}class="on"{% endif %}>Harvi health</a>
      {% endif %}
    </nav>
    <details class="settings">
      <summary aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </summary>
      <div class="settings-panel">
        <label class="settings-row">Theme
          <select id="theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        {% if request.endpoint != 'login' %}
        <a class="settings-row" href="{{ url_for('tariff_settings') }}">Tariff</a>
        <a class="settings-row" href="{{ url_for('upload') }}">Upload a monitor.py log</a>
        {% endif %}
        {% if auth_enabled and signed_in %}
        <form method="post" action="{{ url_for('logout') }}" class="settings-row signout">
          <button type="submit" class="secondary">Sign out</button>
        </form>
        {% endif %}
      </div>
    </details>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script>
    (function () {
      const root = document.documentElement, pick = document.getElementById("theme");
      pick.value = root.dataset.theme;

      function apply() {
        root.dataset.theme = pick.value;
        // Server-drawn images (the report chart) come in a light and a dark version.
        document.querySelectorAll("img[data-themed-src]").forEach((img) => {
          const u = new URL(img.dataset.themedSrc, location.href);
          if (pick.value === "dark") u.searchParams.set("theme", "dark");
          if (img.src !== u.href) img.src = u.href;
        });
      }
      pick.addEventListener("change", () => {
        try { localStorage.setItem("theme", pick.value); } catch (e) {}
        apply();
      });
      apply();

      const menu = document.querySelector("details.settings");
      document.addEventListener("click", (e) => { if (menu && menu.open && !menu.contains(e.target)) menu.open = false; });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && menu) menu.open = false; });
    })();
  </script>
</body>
</html>
