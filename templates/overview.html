{% extends "base.html" %}
{% block title %}Overview · myenergi monitor{% endblock %}
{% block content %}
<h1>Overview</h1>
<div id="overview">{% include "_overview.html" %}</div>
<script>
  (function () {
    const box = document.getElementById("overview");
    // Each refresh brings a new <svg>, whose animation clock starts at zero; set it to the page's clock so the
    // moving arrowheads carry on smoothly instead of jumping back to the start.
    function syncArrows() {
      const svg = box.querySelector(".flow svg");
      if (svg && svg.setCurrentTime) svg.setCurrentTime(performance.now() / 1000);
    }
    syncArrows();
    async function refresh() {
      try {
        const r = await fetch("{{ url_for('overview_partial') }}", {cache: "no-store"});
        if (r.status === 401) return location.reload();   // signed out: reload into the login page
        box.innerHTML = await r.text();
        syncArrows();
      } catch (e) {
        const s = document.getElementById("status");
        if (s) s.textContent = "Refresh failed: " + e;
      }
    }
    setInterval(refresh, {{ refresh * 1000 }});
  })();
</script>
{% endblock %}
